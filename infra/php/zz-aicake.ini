; Loaded last (zz- prefix) so it wins over the image defaults.
; Testbed values — production will need its own, and is likely to be stricter.

; An A4 sheet at 300 DPI is 2480x3508 = 8.7M pixels, roughly 35 MB in memory
; per copy before compositing. Intermediates during a 4x upscale are larger
; still. 128M (the current setting) fatals; 256M is tight; 512M is comfortable.
memory_limit = 512M

; Image generation takes 5-15s, an upscale longer. Background jobs run in a
; separate request, but they still need room to finish.
max_execution_time = 300
max_input_time = 300

; Not strictly needed (no customer uploads in v1) but harmless, and avoids
; surprises when importing test fixtures.
upload_max_filesize = 64M
post_max_size = 64M

; Log to the container's stderr so `docker compose logs wordpress` shows it.
log_errors = On
display_errors = Off
